name: 'Deploy to SureCart'
description: 'Attach a release to one or more SureCart products. v1: use an existing SureCart-hosted media (media_uuid). v2: pull a GitHub release asset, upload to Cloudflare R2, attach the external URL.'
author: 'Matteo Greco <matteo@digitalgravy.co>'

inputs:
  # ─── v1 mode (legacy — pass media_uuid) ───
  media_uuid:
    description: 'The media UUID of a file already uploaded to SureCart. Triggers v1 mode. Mutually exclusive with release_tag.'
    required: false
    default: ''

  # ─── v2 mode (pass release_tag + R2 inputs) ───
  release_tag:
    description: 'GitHub release tag to publish. Accepts "latest". Triggers v2 mode (the action will download the matching release asset, upload to R2, and attach the external URL). Mutually exclusive with media_uuid.'
    required: false
    default: ''
  asset_pattern:
    description: 'Glob filter over release asset names. v2 mode only.'
    required: false
    default: '*.zip'
  current_release_asset_pattern:
    description: 'Glob picking which asset (by name) becomes the current_release_download when set_as_current_release=true. Empty = first matched asset. v2 mode only.'
    required: false
    default: ''
  object_key_prefix:
    description: 'R2 object-key prefix. Final key is <prefix>/<asset-basename>-<sha16>.<ext>. v2 mode only.'
    required: false
    default: 'releases'
  r2_account_id:
    description: 'Cloudflare R2 account ID. Required in v2 mode.'
    required: false
    default: ''
  r2_access_key_id:
    description: 'R2 S3-compatible access key. Required in v2 mode.'
    required: false
    default: ''
  r2_secret_access_key:
    description: 'R2 S3-compatible secret. Required in v2 mode.'
    required: false
    default: ''
  r2_bucket:
    description: 'R2 bucket name. Required in v2 mode.'
    required: false
    default: ''
  r2_public_base_url:
    description: 'Public URL base (e.g. https://dl.example.com — no trailing slash). Required in v2 mode.'
    required: false
    default: ''
  github_token:
    description: 'Token for reading the release and its assets (needed for private repos). Defaults to the workflow GITHUB_TOKEN.'
    required: false
    default: ${{ github.token }}

  # ─── shared (both modes) ───
  product_uuids:
    description: 'Comma-separated list of SureCart product UUIDs to attach the Download(s) to.'
    required: true
  set_as_current_release:
    description: 'When true, PATCH each product so current_release_download points at the new Download.'
    required: false
    default: 'false'
  duplicate_behavior:
    description: 'How to handle a duplicate (already-attached media or URL): "warn" (continue, reuse the existing Download id when surfaced) or "error" (fail).'
    required: false
    default: 'warn'
  duplicate_media_behavior:
    description: 'DEPRECATED alias for duplicate_behavior. Kept for backwards compatibility with v1 callers.'
    required: false
    default: ''
  dry_run:
    description: 'When true, log the planned R2 uploads + SureCart POST/PATCH calls without executing them.'
    required: false
    default: 'false'
  surecart_api_token:
    description: 'SureCart API token (Bearer).'
    required: true

outputs:
  download_ids:
    description: 'Comma-separated list of created/found Download IDs (product × asset).'
  public_urls:
    description: 'Comma-separated list of R2 public URLs uploaded this run. v2 mode only — empty in v1 mode.'
  object_keys:
    description: 'Comma-separated list of R2 object keys created. v2 mode only.'
  action_taken:
    description: 'One of "created", "partial" (some duplicates surfaced), or "skipped" (dry-run).'

runs:
  using: 'node20'
  main: 'dist/index.js'
